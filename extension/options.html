<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>No New Tabs — domains</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
    textarea { width: 100%; height: 240px; font: 13px ui-monospace, monospace; padding: 8px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 7px 16px; font: inherit; cursor: pointer; }
    .hint { color: #666; }
    #saved { margin-left: 10px; color: #2e7d32; }
    #add-current { margin: 0 0 10px; }
  </style>
</head>
<body>
  <h1>No New Tabs</h1>
  <p class="hint">One domain per line. A domain also covers its subdomains, so
    <code>example.com</code> covers <code>www.example.com</code> and <code>app.example.com</code>.
    Pages on these sites cannot open new tabs or windows. Reload open tabs after saving.</p>
  <button id="add-current" hidden></button>
  <textarea id="list" spellcheck="false" placeholder="example.com"></textarea>
  <button id="save">Save</button><span id="saved"></span>
  <script type="module" src="options.js"></script>
</body>
</html>
